<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEAM WORK MANAGEMENT - Quản Lý Công Việc Nội Bộ</title>
  
  <!-- Font chữ Inter chuẩn SaaS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons & Chart.js -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    /* Tùy chỉnh thanh cuộn tinh gọn */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Root mount point for Vanilla SPA -->
  <div id="app-root"></div>

  <!-- Global Loading Spinner Indicator -->
  <div id="global-loader" class="fixed top-3 right-3 z-50 bg-white/90 backdrop-blur-xs border border-slate-200 px-3 py-1.5 rounded-full shadow-lg flex items-center space-x-2 hidden">
    <div class="w-3.5 h-3.5 border-2 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
    <span class="text-[11px] font-semibold text-slate-600">Đang đồng bộ...</span>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

  <!-- Main Application Logic Script -->
  <script src="app.js"></script>
</body>
</html>
